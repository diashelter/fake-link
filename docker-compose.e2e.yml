# E2E override — wires mailpit, short TTLs, and Playwright stage (AD-008).
# Usage: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e …
services:
  backend:
    environment:
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@fake-link.test
      QUEUE_CONNECTION: sync
      AUTH_INVITE_ALLOWLIST_PATH: /var/www/config/invite-allowlist.e2e.json
      LINKS_DESTINATION_KEYRING: '{"dev-key-1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      LINKS_DESTINATION_ACTIVE_KEY_ID: dev-key-1
      LINKS_ETAG_HMAC_KEY: ${LINKS_ETAG_HMAC_KEY:-dev-links-etag-hmac-key}
      LINKS_CURSOR_HMAC_KEY: ${LINKS_CURSOR_HMAC_KEY:-dev-links-cursor-hmac-key}
      LINKS_RATE_LIMIT_HMAC_KEY: ${LINKS_RATE_LIMIT_HMAC_KEY:-dev-links-rate-limit-hmac-key}
      LINKS_IDEMPOTENCY_KEY_HASH_HMAC_KEY: ${LINKS_IDEMPOTENCY_KEY_HASH_HMAC_KEY:-dev-links-idempotency-key-hash-hmac}
      LINKS_IDEMPOTENCY_FINGERPRINT_HMAC_KEY: ${LINKS_IDEMPOTENCY_FINGERPRINT_HMAC_KEY:-dev-links-idempotency-fingerprint-hmac}
      LINKS_IDEMPOTENCY_KEYRING: '{"dev-idem-1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
      LINKS_IDEMPOTENCY_ACTIVE_KEY_ID: ${LINKS_IDEMPOTENCY_ACTIVE_KEY_ID:-dev-idem-1}
    volumes:
      - ./backend/config/invite-allowlist.e2e.json:/var/www/config/invite-allowlist.e2e.json:ro
    depends_on:
      mailpit:
        condition: service_healthy

  frontend:
    build:
      target: e2e
    environment:
      BFF_SESSION_PROBE_ENABLED: "true"
      BFF_SESSION_ABSOLUTE_TTL_SESSION: "20"
      BFF_SESSION_IDLE_TTL_SESSION: "8"
      BFF_SESSION_ABSOLUTE_TTL_VERIFICATION: "20"
      BFF_SESSION_IDLE_TTL_VERIFICATION: "8"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      E2E_APP_ORIGIN: https://app.localhost
      E2E_MAILPIT_URL: http://mailpit:8025
      E2E_REDIS_URL: redis://redis-ephemeral:6379
    depends_on:
      mailpit:
        condition: service_healthy

  nginx:
    networks:
      default:
        aliases:
          - app.localhost
          - go.localhost
